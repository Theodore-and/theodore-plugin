# Theodore's native front: the `theodore` command on every shell and the plugin's MCP server (the relay).
# DESIGN.md §2.1 and §2.2, contract C1. No dependencies: the standard library and the operating system's own calls.
[package]
name = "theodore-front"
version = "0.5.0"
edition = "2021"
publish = false
license-file = "../LICENSE"
description = "Theodore's command and MCP relay: one native process that talks to Theodore's service over its pipe"
build = "build.rs"

[[bin]]
name = "theodore"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
panic = "abort"
