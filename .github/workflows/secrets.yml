# MANUAL MIRROR ONLY. The source of truth is ci/run.sh, run on our own machines (`ci/run.sh all --azure`): it runs
# this job and every other check, and a release requires its stamp (`ci/run.sh require`). No push or pull request
# starts this workflow, so a red or refused hosted run never blocks or misleads anyone; start it by hand if wanted.
# The secret scan of every commit in the history, whatever it changes.
# gitleaks 8.30.1, the release archive checked against its sha256; known false positives are in .gitleaksignore.
# ci/run.sh secrets runs the same scan on a local machine.
name: secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: repository checks (secret scan of every commit)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan of every commit
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1
