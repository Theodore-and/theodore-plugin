# Tests the plugin, the launcher, the client and the installer, and builds the plugin archives.
#
# No secrets and no publishing step. The archives (theodore-<version>.zip for the hosted marketplace.json,
# theodore-plugin-<version>.tar.gz and latest.manifest.json (to be signed at publish) for the installer, client-<version>.tar for the launcher's
# Stage 1, and install/ with install.md, install.sh and install.cmd for the releases bucket) are uploaded as workflow artifacts; putting them on the download host is a manual release step.
# Everything runs against tests/fake_api.py: no Theodore service is contacted, and no account is needed.
name: shim

on:
  push:
    paths-ignore:
      - "runtime/locks/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "runtime/locks/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      release:
        description: "Build the archives as a release: refused while launcher.json carries the placeholder manifest key"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generated files are in step
        run: python tools/sync_launchers.py --check
      # The fake runtime of the tests is a wrapper around this Python, so no bundle is needed here.
      - name: Every suite
        run: python -m unittest discover -s tests -v

  windows:
    name: tests (windows, real runtime bundle, cmd + PowerShell + Git Bash)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A batch launcher cannot be given a shell script as its Python, so Windows tests install the real bundle.
      # The bundle goes outside the checkout: the repository checks walk every file in it.
      - uses: actions/cache@v5
        id: bundle
        with:
          path: ${{ runner.temp }}/bundle
          key: runtime-win32-x64-${{ hashFiles('runtime/locks/**', 'runtime/build/build_bundle.py') }}
      - name: Build the runtime bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        run: python runtime/build/build_bundle.py --platform win32-x64 --out "$RUNNER_TEMP/bundle" --work "$RUNNER_TEMP/runtime-work"
      - name: Inbox tools
        shell: cmd
        run: |
          where curl.exe tar.exe certutil.exe findstr.exe
          ver
      - name: Every suite (launcher through cmd, PowerShell with AllSigned, Git Bash; a home path with a space)
        env:
          THEODORE_TEST_BUNDLE: ${{ runner.temp }}\bundle
        run: python -m unittest discover -s tests -v

  network:
    name: corporate network (TLS inspection, authenticating proxy)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: A test certificate in the system store (what an inspecting proxy's root looks like once IT installs it)
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/trusted-key.pem" -out "$RUNNER_TEMP/trusted-cert.pem" \
            -days 2 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE"
          sudo cp "$RUNNER_TEMP/trusted-cert.pem" /usr/local/share/ca-certificates/theodore-test.crt
          sudo update-ca-certificates
      # The package starts its own open proxy on 8888; stop it and run ours on another port, then prove that ours
      # refuses a request without credentials, so the test cannot pass through an open proxy.
      - name: An authenticating proxy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tinyproxy
          sudo systemctl stop tinyproxy || true
          printf 'Port 18888\nListen 127.0.0.1\nTimeout 600\nBasicAuth tester secret\nAllow 127.0.0.1\n' > "$RUNNER_TEMP/tinyproxy.conf"
          tinyproxy -c "$RUNNER_TEMP/tinyproxy.conf"
          sleep 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -x http://127.0.0.1:18888 http://example.com/ || true)
          echo "proxy without credentials answers $code"
          test "$code" = 407
      - name: Launcher and client behind both
        env:
          THEODORE_TEST_TRUSTED_CERT: ${{ runner.temp }}/trusted-cert.pem:${{ runner.temp }}/trusted-key.pem
          THEODORE_TEST_AUTH_PROXY: http://127.0.0.1:18888
          THEODORE_TEST_AUTH_PROXY_CREDENTIALS: tester:secret
        run: python -m unittest -v tests.test_launcher.CorporateNetwork

  archives:
    name: plugin and client archives
    runs-on: ubuntu-22.04
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The repository carries the placeholder manifest key; keys are stamped per environment at release. A release
      # build must refuse a tree that was not stamped (the plugin would refuse to start for every user).
      - name: A release build refuses the placeholder key
        run: |
          if python tools/build_plugin_archives.py --out "$RUNNER_TEMP/release-check" --release; then
            echo "an unstamped tree was accepted as a release"; exit 1
          fi
      - name: Build
        env:
          RELEASE: ${{ inputs.release && '--release' || '' }}
        run: |
          python tools/build_plugin_archives.py --out dist/plugin $RELEASE
          python runtime/build/build_client.py --out dist/client
          mkdir -p dist/install && cp install/install.md install/install.sh install/install.cmd dist/install/
          sha256sum dist/plugin/* dist/client/* dist/install/* | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-archives
          path: dist/
          if-no-files-found: error
