# Builds and smoke-tests the runtime bundle for the five platforms from the public lock files in runtime/locks/.
#
# No secrets and no publishing step: the bundles and the combined index are uploaded as workflow artifacts only.
# Publishing them to R2 and registering the runtime with the backend is the lead's manual step.
# The engine is private and never enters this repository or its CI: the smoke test runs without --engine.
name: runtime

on:
  push:
    paths:
      - "runtime/locks/**"
      - "runtime/build/**"
      - ".github/workflows/runtime.yml"
  pull_request:
    paths:
      - "runtime/locks/**"
      - "runtime/build/**"
      - ".github/workflows/runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and macos-13 are retired; macos-15-intel is the standard (free) Intel runner.
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: win32-x64, runner: windows-latest }
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The host Python only runs the recipe; the bundle carries its own.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the bundle
        run: python runtime/build/build_bundle.py --platform ${{ matrix.platform }} --out out --work "$RUNNER_TEMP/runtime-work"
      - name: Smoke-test the bundle
        env:
          # The unpacked trees go under a short path (matters on Windows).
          TMPDIR: ${{ runner.temp }}
        run: python runtime/build/smoke_test.py --bundle out --platform ${{ matrix.platform }}
      # The launcher and the installer bootstrap this very bundle from the local fake API (stage 1 with the system
      # tar and curl, stage 2 with the bundle's own Python), in a clean home whose path has a space.
      - name: Launcher and installer against the bundle
        env:
          THEODORE_TEST_BUNDLE: ${{ github.workspace }}/out
        run: python -m unittest -v tests.test_launcher tests.test_installer
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
          compression-level: 0

  index:
    name: combined index
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: bundles
      - name: Write runtime-<id>.json (with lock_sha256)
        run: python tools/runtime_index.py bundles --out .
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-index
          path: runtime-*.json
          if-no-files-found: error
